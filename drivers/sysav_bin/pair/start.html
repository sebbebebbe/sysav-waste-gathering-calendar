<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    label { display: block; margin: 10px 0 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .hint { font-size: 12px; color: #888; margin-top: 4px; }
    button { margin-top: 18px; width: 100%; padding: 10px; background: #007aff; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
    button:disabled { background: #aaa; }
    .status { margin-top: 12px; font-size: 13px; color: #b00; text-align: center; min-height: 1em; white-space: pre-line; }
  </style>
</head>
<body>
  <label for="street_name" data-i18n="pair.street_name_label">Street name</label>
  <input id="street_name" type="text" autocomplete="off" />

  <label for="street_number" data-i18n="pair.street_number_label">Street number</label>
  <input id="street_number" type="text" autocomplete="off" />

  <label for="city" data-i18n="pair.city_label">City</label>
  <input id="city" type="text" autocomplete="off" />

  <div class="hint" data-i18n="pair.hint">Try your address on sysav.se first so you know it's recognised.</div>

  <button id="btn" onclick="lookup()" data-i18n="pair.lookup_button">Look up pickup schedule</button>
  <div class="status" id="status"></div>

  <script>
    function lookup() {
      var street_name = document.getElementById('street_name').value.trim();
      var street_number = document.getElementById('street_number').value.trim();
      var city = document.getElementById('city').value.trim();
      var btn = document.getElementById('btn');
      var status = document.getElementById('status');

      btn.disabled = true;
      status.textContent = Homey.__('pair.status_looking_up');

      Homey.emit('address', {
        street_name: street_name,
        street_number: street_number,
        city: city,
      }, function(err) {
        if (err) {
          status.textContent = err.message || err;
          btn.disabled = false;
          return;
        }
        Homey.showView('list_devices');
      });
    }

    ['street_name', 'street_number', 'city'].forEach(function(id) {
      document.getElementById(id).addEventListener('keydown', function(e) {
        if (e.key === 'Enter') lookup();
      });
    });
  </script>
</body>
</html>
